name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Read version
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_ENV
      - run: npm ci
      - run: npm run build:android
      - run: npx cap add android
      - run: node scripts/apply-android-icons.mjs
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Sxchedule.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sxchedule
          path: dist-apk/Sxchedule.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Sxchedule ${{ env.APP_VERSION }}
          files: dist-apk/Sxchedule.apk
          generate_release_notes: true
